<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intersection株式会社</title>
<link rel="canonical" href="https://intersection.co.jp/">
<meta http-equiv="refresh" content="0; url=https://intersection.co.jp/">
<meta name="robots" content="noindex">
<style>
  :root { --bg: #0c0c0c; --fg: #ecebe6; --muted: #9a9993; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    font-size: 15px; line-height: 1.9; letter-spacing: .02em;
    min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center;
  }
  .logo { font-size: 12px; letter-spacing: .32em; color: var(--muted); margin-bottom: 28px; }
  h1 { font-size: 18px; font-weight: 500; line-height: 1.7; }
  p { margin-top: 16px; color: var(--muted); font-size: 14px; }
  a.btn {
    display: inline-block; margin-top: 28px; padding: 14px 28px;
    background: var(--fg); color: var(--bg); text-decoration: none;
    font-size: 14px; font-weight: 500; letter-spacing: .08em;
  }
</style>
</head>
<body>
  <main>
    <div class="logo">INTERSECTION</div>
    <h1>ウェブサイトは<br>intersection.co.jp に移転しました</h1>
    <p>自動で移動します。切り替わらない場合は下のボタンからどうぞ。</p>
    <a class="btn" href="https://intersection.co.jp/">サイトへ移動する</a>
  </main>
  <script>location.replace("https://intersection.co.jp/" + location.search + location.hash);</script>
</body>
</html>
